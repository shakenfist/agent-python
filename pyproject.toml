[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[simple]>=6.2",
    "wheel",
    "build",
    "twine"
]
build-backend = "setuptools.build_meta"

[project]
name = "shakenfist_agent"
dynamic = ["version"]

description = "The in-guest agent for ShakenFist instances"
readme = "README.md"
# Minimum Python determined by oldest supported distro.
# See ARCHITECTURE.md "Supported Platforms" table.
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",                     # bsd
    "distro",                           # apache2
    "psutil>5.9.0",                     # bsd
    "symbolicmode>=2.0",                # CC0 1.0 Universal (CC0 1.0) Public Domain Dedication
    "setproctitle",                     # bsd

    "protobuf>=5.29.0,<8",              # bsd
    "grpcio>=1.70.0",                   # apache2
]

[project.urls]
"Homepage" = "https://shakenfist.com"
"Bug Tracker" = "https://github.com/shakenfist/agent-python/issues"

[project.scripts]
sf-agent = "shakenfist_agent.main:cli"

# The tests run from the checkout and must not ship. The exclude below
# drops them as a package, but include-package-data defaults to true under
# pyproject.toml and setuptools_scm's file finder offers every git-tracked
# file as package data, so they would come straight back as data without
# this. Nothing in this package reads a data file at runtime: the
# generated *_pb2 modules embed their descriptors, so the .proto sources
# and _copy_stubs.sh, which regenerate them, stay in the checkout too.
[tool.setuptools]
include-package-data = false

# commandline/ and protos/ have no __init__.py; namespaces (the default
# here) is what finds them.
[tool.setuptools.packages.find]
include = ["shakenfist_agent*"]
exclude = ["shakenfist_agent.tests*"]

[tool.setuptools_scm]
git_describe_command = "git describe --dirty --tags --match v* --first-parent"
write_to = "shakenfist_agent/_version.py"

[project.optional-dependencies]
test = [
    "coverage",            # apache2
    "testtools<2.9.2",     # mit; stestr uses _b removed in 2.8
    "mock",                # bsd
    "stestr",              # apache2
    "tox",                 # mit
    "flake8",              # mit
]
