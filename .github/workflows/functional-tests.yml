name: Functional tests

# NOTE(mikal): git repos are checked out to /srv/github/_work/{repo}/{repo}
# which is available as GITHUB_WORKSPACE. You can find other environment
# variables at:
# https://docs.github.com/en/actions/learn-github-actions/environment-variables
#
# The can_enqueue / can_merge scheme is as described at:
# https://boinkor.net/2023/11/neat-github-actions-patterns-for-github-merge-queues/

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  # Detect pull requests touching only docs/ so the vm lane below can
  # skip them. A filter job rather than trigger-level paths-ignore, as in
  # kerbside: the workflow still reports on every pull request, so a
  # required status check added later cannot be left waiting forever on
  # a filtered one, and a skipped job satisfies a required check where a
  # workflow that never ran does not. On workflow_dispatch -- which is
  # how pr-retest.yml re-runs this -- the filter step is skipped and the
  # output defaults to code_changed=true, so a retest always tests.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # By default a file matches the filter if it matches ANY listed
          # pattern, which makes '**' match everything and silently
          # defeats the exclusion. 'every' requires a file to match ALL
          # patterns, which is the correct semantics for "everything
          # except docs".
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
      # Make the verdict visible in the log rather than inferred from
      # which downstream jobs skipped.
      - name: Report verdict
        run: echo "code_changed=${{ steps.filter.outputs.code || 'true (defaulted)' }}"

  # These sanity checks used to be three separate jobs, but are now combined
  # to save a little time and reduce CI runner churn.
  sanity_checks:
    needs: [check_paths]
    if: needs.check_paths.outputs.code_changed == 'true'
    # s rather than the conductor's xs fallback: the job builds three
    # virtualenvs, installs the grpc stack into each and runs the unit
    # tests twice, which is more than one vCPU and 2GB wants to carry.
    runs-on: [self-hosted, vm, debian-13, s]
    # The timed steps sum to 35 minutes; the rest is headroom for the
    # checkout and the artifact upload.
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true

    steps:
      - name: Checkout code with two commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Upgrade base test tools
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-test
          . /tmp/venv-test/bin/activate
          pip3 install uv
          uv pip install tox tox-uv

      - name: Lint with flake8
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -eflake8

      - name: Attempt to install requirements
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-reqs
          . /tmp/venv-reqs/bin/activate
          pip3 install uv
          uv pip install -r pyproject.toml

      - name: Run python3 unit tests
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          tox -epy3

      - name: Generate coverage report
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          tox -ecover
          zip -r cover.zip cover

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          retention-days: 90
          if-no-files-found: error
          path: cover.zip

  can_see_status:
    runs-on: [self-hosted, static]
    # Runs "true", so five minutes is generous even on a busy runner.
    timeout-minutes: 5
    steps:
      - name: "Immediate success"
        run: true

  can_merge:
    needs:
      - check_paths
      - sanity_checks
    if: always()
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq one-liner over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"

  automated_reviewer:
    name: "Automated reviewer"
    # The needs: list and the if: below are the "review only once CI
    # has passed" gate. sanity_checks is skipped, not failed, on a
    # docs-only pull request, and a plain needs: would skip this job
    # along with it -- but docs changes deserve a review as much as
    # code does. So the condition is spelled out: check_paths must
    # have succeeded, and sanity_checks must have succeeded or been
    # skipped by it. Everything else about the reviewer -- runner,
    # timeout, fork restriction, bot-commit check -- lives in the
    # shared workflow so it stays in step with the rest of the fleet.
    needs: [check_paths, sanity_checks]
    if: >-
      always() &&
      needs.check_paths.result == 'success' &&
      (needs.sanity_checks.result == 'success' ||
       needs.sanity_checks.result == 'skipped')
    # A cross-repository reusable workflow cannot grant itself more
    # token scope than its caller has, so the permissions go here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
