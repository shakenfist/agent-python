repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(tools/|shakenfist_agent/protos/)
        types_or: [sh, bash, shell]
        args: ['-x']

  # Lints the agent context -- AGENTS.md, CLAUDE.md, and anything else
  # an agent is handed -- for malformed structure, smuggled
  # instructions and secrets pasted in by accident. The daily
  # consistency audit checks the same things, but up to twenty-four
  # hours later; this catches them in the commit that introduces them.
  # Renovate's pre-commit manager keeps the rev current.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.20.0
    hooks:
      - id: skillsaw
